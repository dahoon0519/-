name: Temporary Latte Art Visual Review (public thumbnails only)
on:
  push:
    branches: [feat/content-cleanup-latte-20261029]
permissions:
  contents: read
jobs:
  visual-contact-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build lightweight contact sheet from existing public images
        run: |
          python -m pip -q install pillow
          python - <<'PY'
          import urllib.request, io, base64
          from PIL import Image, ImageDraw
          refs = [
            'fe1ea721-d8d7-464e-b848-e8c413cb1247',
            '3f0da6d6-9661-48e2-b989-bae61d2569f0',
            'b2806e0e-22ad-4432-a86e-18e53149b9a6',
            '6037963b-feda-4ef3-a7bb-b663d168c682',
            'fa45806e-b11f-46c8-84ff-5e0e782398b1',
          ]
          versions = [1793163054, 1793163097, 1793163130, 1793163197, 1793163216]
          canvas=Image.new('RGB',(1200,310),'#eeeae3')
          draw=ImageDraw.Draw(canvas)
          for i, (asset, version) in enumerate(zip(refs, versions)):
            url=f'https://res.cloudinary.com/sxl1v5vx/image/upload/c_fill,w_480,h_480/v{version}/dahoon-portfolio/{asset}.jpg'
            req=urllib.request.Request(url,headers={'User-Agent':'PortfolioVisualReview/1.0'})
            with urllib.request.urlopen(req,timeout=15) as response:
              b=response.read()
            photo=Image.open(io.BytesIO(b)).convert('RGB')
            photo.thumbnail((224,260))
            x=i*240+(240-photo.width)//2
            canvas.paste(photo,(x,28))
            draw.text((i*240+16,5),f'PHOTO {i+1}',fill='#111111')
          out=io.BytesIO()
          canvas.save(out,format='JPEG',quality=56,optimize=True)
          print('IMG_START'+base64.b64encode(out.getvalue()).decode()+'IMG_END')
          PY
